# ---------------------------------------------------------------------------
# NEXA on Render — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then New → Blueprint and point it here.
# Render provisions the database, builds the Dockerfile, and wires DATABASE_URL
# automatically. The only values you must set by hand are the ones that are
# secrets: AI_API_KEY, and payment/SMTP credentials if you use them.
# ---------------------------------------------------------------------------

databases:
  - name: nexa-db
    databaseName: nexa
    user: nexa
    # Free tier expires after 90 days; move to `starter` before running a real
    # business on it. Losing a production database to a plan expiry is not a
    # theoretical risk.
    plan: free

services:
  - type: web
    name: nexa
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # API_PORT is deliberately absent. Render assigns a port, injects it as
      # PORT, and health-checks that port; the config gives PORT precedence.
      # Pinning API_PORT here would bind somewhere Render is not listening and
      # surface as a crash loop with nothing wrong in the application log.
      - key: DATABASE_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: nexa-db
          property: connectionString

      # Generated once by Render and kept stable across deploys. Rotating this
      # invalidates every active session, which is the intended behaviour if a
      # leak is ever suspected.
      - key: AUTH_SECRET
        generateValue: true

      # Render terminates TLS, so cookies must be Secure.
      - key: COOKIE_SECURE
        value: true
      # WEB_ORIGIN is deliberately absent. Render injects RENDER_EXTERNAL_URL
      # at runtime with the full https:// origin, and packages/config falls back
      # to it. `fromService … property: host` would look right here but yields a
      # bare hostname with no scheme, which silently breaks every verification
      # and password-reset link. Set WEB_ORIGIN explicitly only for a custom
      # domain.

      - key: AI_PROVIDER
        value: mock # switch to `anthropic` once AI_API_KEY is set
      - key: AI_API_KEY
        sync: false # set in the dashboard; never committed
      - key: AI_MODEL
        value: claude-opus-5
      - key: AI_MONTHLY_BUDGET_CENTS
        value: 0

      - key: EMAIL_PROVIDER
        value: console
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

      - key: PAYMENT_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER_KEY
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false

      # Demo data is for evaluating NEXA, not for a live workspace.
      - key: SEED_DEMO_DATA
        value: false
