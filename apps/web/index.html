<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f9" />
    <title>NEXA — Your business, on autopilot</title>
    <meta
      name="description"
      content="An intelligent operating system that helps you understand your business, manage daily operations and act on opportunities."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235B45E6'/%3E%3Cpath d='M9 23V9l14 14V9' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <script>
      /*
       * Theme boot — runs before first paint, deliberately inline and blocking.
       *
       * If the theme class were applied by React, every dark-mode user would
       * see a white flash on each load. This is the one place a blocking inline
       * script earns its cost.
       */
      (function () {
        try {
          var stored = localStorage.getItem('nexa.theme');
          var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0d0f16');
          }
        } catch (e) {
          /* Private mode or blocked storage — light is a safe default. */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
